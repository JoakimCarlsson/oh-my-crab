[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
omc-auth = { path = "crates/omc-auth" }
omc-providers = { path = "crates/omc-providers" }
omc-tools = { path = "crates/omc-tools" }
omc-ui = { path = "crates/omc-ui" }
