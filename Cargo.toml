[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
omc-agent = { path = "crates/omc-agent" }
omc-auth = { path = "crates/omc-auth" }
omc-providers = { path = "crates/omc-providers" }
omc-tools = { path = "crates/omc-tools" }
omc-wire = { path = "crates/omc-wire" }
omc-mcp = { path = "crates/omc-mcp" }
omc-session = { path = "crates/omc-session" }
omc-client = { path = "crates/omc-client" }
