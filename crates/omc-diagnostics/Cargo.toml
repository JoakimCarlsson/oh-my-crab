[package]
name = "omc-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crash log, bug reports and OpenTelemetry export for crab and the programs that host it"
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[dependencies]
dirs = "7.0.0"
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
  "metrics",
], optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = { version = "0.1.44", optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "registry",
  "std",
], optional = true }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[features]
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:reqwest",
  "dep:tracing",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
]
