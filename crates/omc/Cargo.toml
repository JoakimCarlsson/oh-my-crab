[package]
name = "omc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "crab, a coding-agent harness that talks to its client in JSON lines over standard input and output"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "crab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
omc-providers.workspace = true
omc-session = { version = "0.1.3", path = "../omc-session" }
omc-wire.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
