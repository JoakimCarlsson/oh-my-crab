[package]
name = "omc-extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Extensions for crab: long-running programs that watch, steer and add tools to a conversation over JSON lines"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
futures-util = "0.3.34"
omc-agent = { version = "0.1.0", path = "../omc-agent" }
omc-mcp = { version = "0.1.0", path = "../omc-mcp" }
omc-providers = { version = "0.1.0", path = "../omc-providers" }
omc-tools = { version = "0.1.0", path = "../omc-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "io-util", "process", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
