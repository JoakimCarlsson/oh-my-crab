[package]
name = "omc-dap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The debug tool of crab, driving debuggers through the Debug Adapter Protocol"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
omc-tools = { version = "0.1.1", path = "../omc-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "sync", "time", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
