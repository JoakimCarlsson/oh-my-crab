[package]
name = "omc-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language servers crab starts itself"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
omc-tools = { version = "0.1.8", path = "../omc-tools" }
omc-wire = { version = "0.1.8", path = "../omc-wire" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
  "rt",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
  "net",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
