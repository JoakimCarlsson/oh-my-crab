[package]
name = "omc-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language servers crab starts itself"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
omc-tools = { version = "0.1.0", path = "../omc-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "sync", "time", "fs"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
