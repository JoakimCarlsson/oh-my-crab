[package]
name = "omc-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model providers for crab: streaming chat over the Anthropic, OpenAI and Chat Completions wire formats, Claude on Bedrock and Vertex, a model catalog and custom endpoints"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
crc32fast = "1.5.4"
dirs = "7.0.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
omc-auth.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "stream"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
