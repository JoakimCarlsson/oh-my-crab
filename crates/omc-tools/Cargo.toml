[package]
name = "omc-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omc-context = { version = "0.1.0", path = "../omc-context" }
omc-wire = { version = "0.1.0", path = "../omc-wire" }
omc-memory = { version = "0.1.0", path = "../omc-memory" }
ast-grep-core = "0.51.1"
ast-grep-language = { version = "0.51.1", default-features = false, features = [
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-lua",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
async-trait = "0.1.92"
bit-set = "0.11.1"
globset = "0.4.21"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "fs", "io-util", "process", "time", "sync"] }
unicode-width = "0.2.3"
base64 = "0.23.1"
dirs = "7.0.0"
htmd = "0.5.6"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1.13.1"
toml = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "test-util"] }
