[package]
name = "omc-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omc-context = { version = "0.1.0", path = "../omc-context" }
omc-wire = { version = "0.1.0", path = "../omc-wire" }
async-trait = "0.1.92"
globset = "0.4.21"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "fs", "io-util", "process", "time", "sync"] }
unicode-width = "0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
