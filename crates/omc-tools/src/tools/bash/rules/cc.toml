# Condensing rules for C and C++ compilers: a diagnostic repeated straight after itself is counted. Include chains stay, since they say how a header was reached.

[[filter]]
name = "cc"
programs = ["gcc", "g++", "cc", "c++", "clang", "clang++"]

[[test]]
command = "gcc -Wall -c main.c"
input = """
In file included from /usr/include/stdio.h:42,
                 from main.c:1:
main.c:10:5: error: implicit declaration of function 'foo'
   10 |     foo();
      |     ^~~
main.c:15:9: warning: unused variable 'x' [-Wunused-variable]
"""
expected = """
In file included from /usr/include/stdio.h:42,
                 from main.c:1:
main.c:10:5: error: implicit declaration of function 'foo'
   10 |     foo();
      |     ^~~
main.c:15:9: warning: unused variable 'x' [-Wunused-variable]
"""

[[test]]
command = "clang -c a.c"
input = """
a.c:3:1: note: candidate not viable
a.c:3:1: note: candidate not viable
a.c:3:1: note: candidate not viable
a.c:9:2: error: no matching function for call to 'f'
"""
expected = """
a.c:3:1: note: candidate not viable
… the line above repeated 2 more times
a.c:9:2: error: no matching function for call to 'f'
"""
