  curl
0 upgraded, 1 newly installed, 0 to remove and 0 not upgraded.
Get:1 http://archive.ubuntu.com/ubuntu jammy/main amd64 curl amd64 7.81.0 [194 kB]
Fetched 194 kB in 1s (210 kB/s)
… 5 install step lines
"""

