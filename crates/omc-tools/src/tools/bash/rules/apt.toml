Fetched 194 kB in 1s (210 kB/s)
Selecting previously unselected package curl.
(Reading database ... 5%\r(Reading database ... 100%\r(Reading database ... 112300 files and directories currently installed.)
Preparing to unpack .../curl_7.81.0_amd64.deb ...
Unpacking curl (7.81.0) ...
Setting up curl (7.81.0) ...
Processing triggers for man-db (2.10.2-1) ...
"""
