# Condensing rules for system package managers: index fetches and per-package install steps.

[[filter]]
name = "apt"
programs = ["apt", "apt-get", "aptitude"]
drop = [
  '^(Reading package lists|Building dependency tree|Reading state information)\.\.\.( Done)?$',
  '^\(Reading database \.\.\.',
]
collapse = [
  { pattern = '^(Get|Hit|Ign):\d+ ', label = "package index" },
  { pattern = '^(Selecting previously unselected package|Preparing to unpack|Unpacking|Setting up|Processing triggers for) ', label = "install step" },
]

[[filter]]
name = "dnf"
programs = ["dnf", "yum", "microdnf"]
collapse = [
  { pattern = '^\s+(Installing|Upgrading|Verifying|Running scriptlet|Cleanup|Erasing|Preparing|Downgrading|Reinstalling)\s*:', label = "transaction step" },
  { pattern = '^\(\d+/\d+\): \S+', label = "download" },
]

[[test]]
command = "sudo apt-get install -y curl"
input = """
Reading package lists... Done
Building dependency tree... Done
Reading state information... Done
