Progress: resolved 412, reused 380, downloaded 32, added 412, done
Packages: +412
++++++++++++++++++++++++++++++++++++++++++++++++++
dependencies:
+ react 18.3.1

Done in 3.2s
"""
expected = """
… 3 progress lines
Packages: +412
dependencies:
+ react 18.3.1

Done in 3.2s
"""

