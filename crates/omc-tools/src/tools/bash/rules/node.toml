# Condensing rules for npm, pnpm, yarn and bun: install progress, funding notices and audit dependency paths.

[[filter]]
name = "npm"
programs = ["npm", "pnpm", "yarn", "bun"]
subcommands = ["install", "i", "ci", "add", "update", "up", "upgrade", "remove", "rm", "uninstall", "dedupe", "prune", "audit", "outdated", ""]
value_options = ["-C", "--dir", "--prefix", "--cwd", "--filter", "-F"]
drop = [
  '^\d+ packages? (is|are) looking for funding$',
  '^\s+run `npm fund` for details$',
  '^[+-]{8,}$',
  '^(➤ )?YN0000: [┌└]',
  '^(➤ )?YN0000: │ ',
  '^\[\d+/\d+\] (Resolving|Fetching|Linking|Building)',
  '^(info )?(No lockfile found|Lockfile is up to date)',
  '^info There appears to be trouble with your network connection',
  '^Resolving: total \d+, reused \d+, downloaded \d+',
  '^Packages are hard linked from the content-addressable store',
]
collapse = [
  { pattern = '^Progress: resolved \d+, reused \d+, downloaded \d+, added \d+', label = "progress" },
  { pattern = '^Downloading \S+: [\d.]+ [kMG]?B/[\d.]+ [kMG]?B', label = "download" },
  { pattern = '^\s*node_modules/\S+$', label = "dependency path" },
  { pattern = '^npm (http|timing|sill|verb|info) ', label = "npm log" },
]

[[test]]
command = "npm install"
input = """
npm warn deprecated inflight@1.0.6: This module is not supported
npm warn deprecated inflight@1.0.6: This module is not supported

added 412 packages, and audited 413 packages in 9s

87 packages are looking for funding
  run `npm fund` for details

found 0 vulnerabilities
"""
expected = """
npm warn deprecated inflight@1.0.6: This module is not supported
npm warn deprecated inflight@1.0.6: This module is not supported

added 412 packages, and audited 413 packages in 9s

found 0 vulnerabilities
"""

[[test]]
command = "pnpm install --frozen-lockfile"
input = """
