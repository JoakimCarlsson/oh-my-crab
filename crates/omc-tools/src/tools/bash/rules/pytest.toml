# Condensing rules for pytest: session header details and the progress of passing tests.

[[filter]]
name = "pytest"
programs = ["pytest", "py.test"]
drop = [
  '^platform \S+ -- Python ',
  '^(cachedir|rootdir|plugins|configfile|testpaths|asyncio): ',
  '^\S+\.py [.sxX]+\s*(\[\s*\d+%\])?$',
  '^[.sxX]+\s*(\[\s*\d+%\])?$',
]
collapse = [
  { pattern = '^\S+::\S+ PASSED(\s+\[\s*\d+%\])?$', label = "PASSED" },
]

[[test]]
command = "python -m pytest tests"
input = """
============================= test session starts ==============================
platform linux -- Python 3.12.1, pytest-8.0.0, pluggy-1.4.0
rootdir: /work/app
configfile: pyproject.toml
plugins: cov-4.1.0
collected 12 items

tests/test_parse.py ........                                             [ 66%]
tests/test_format.py ..F.                                                [100%]

=================================== FAILURES ===================================
________________________________ test_round ____________________________________
E       assert 1 == 2
tests/test_format.py:9: AssertionError
=========================== short test summary info ============================
FAILED tests/test_format.py::test_round - assert 1 == 2
========================= 1 failed, 11 passed in 0.12s =========================
"""
expected = """
============================= test session starts ==============================
collected 12 items

tests/test_format.py ..F.                                                [100%]

=================================== FAILURES ===================================
________________________________ test_round ____________________________________
E       assert 1 == 2
tests/test_format.py:9: AssertionError
=========================== short test summary info ============================
FAILED tests/test_format.py::test_round - assert 1 == 2
========================= 1 failed, 11 passed in 0.12s =========================
"""

[[test]]
command = "pytest -v"
input = """
tests/test_parse.py::test_numbers PASSED                                 [ 33%]
tests/test_parse.py::test_words PASSED                                   [ 66%]
tests/test_parse.py::test_spaces SKIPPED (slow)                          [100%]
"""
expected = """
… 2 PASSED lines
tests/test_parse.py::test_spaces SKIPPED (slow)                          [100%]
"""
