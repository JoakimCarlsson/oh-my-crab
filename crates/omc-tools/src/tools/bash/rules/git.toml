# Condensing rules for git: status hints and transfer progress. Logs, diffs and shown commits are never condensed, so their text and hunks reach the model whole.

[[filter]]
name = "git status"
programs = ["git"]
subcommands = ["status"]
value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace"]
drop = [
  '^\s+\(use "git .*\)$',
  '^\s+\(commit or discard the untracked or modified content in submodules\)$',
]

[[filter]]
name = "git transfer"
programs = ["git"]
subcommands = ["push", "pull", "fetch", "clone"]
value_options = ["-C", "-c", "--git-dir", "--work-tree", "--namespace"]
drop = [
  '^(remote: )?(Enumerating objects|Counting objects|Compressing objects|Receiving objects|Resolving deltas|Writing objects|Unpacking objects|Updating files|Checking out files|Filtering content): ',
  '^(remote: )?Total \d+ \(delta \d+\)',
  '^Delta compression using up to \d+ threads',
  '^remote: ?$',
]

[[test]]
command = "git status"
input = """
On branch main
Changes not staged for commit:
  (use "git add <file>..." to update what will be committed)
  (use "git restore <file>..." to discard changes in working directory)
	modified:   src/lib.rs

Untracked files:
  (use "git add <file>..." to include in what will be committed)
	notes.txt

no changes added to commit (use "git add" and/or "git commit -a")
"""
expected = """
On branch main
Changes not staged for commit:
	modified:   src/lib.rs

Untracked files:
	notes.txt

no changes added to commit (use "git add" and/or "git commit -a")
"""

[[test]]
command = "git push origin main"
input = """
Enumerating objects: 5, done.
Counting objects: 100% (5/5), done.
Delta compression using up to 8 threads
Compressing objects: 100% (3/3), done.
Writing objects:  50% (1/2)\rWriting objects: 100% (3/3), 310 bytes | 310.00 KiB/s, done.
Total 3 (delta 2), reused 0 (delta 0), pack-reused 0
remote: Resolving deltas: 100% (2/2), completed with 2 local objects.
To github.com:example/repo.git
   1111111..2222222  main -> main
"""
expected = """
To github.com:example/repo.git
   1111111..2222222  main -> main
"""

[[test]]
command = "git pull"
input = """
remote: Enumerating objects: 7, done.
remote: Total 7 (delta 3), reused 7 (delta 3), pack-reused 0
Unpacking objects: 100% (7/7), 1.2 KiB | 300.00 KiB/s, done.
From github.com:example/repo
   2222222..3333333  main       -> origin/main
error: Your local changes to the following files would be overwritten by merge:
	src/lib.rs
"""
expected = """
From github.com:example/repo
   2222222..3333333  main       -> origin/main
error: Your local changes to the following files would be overwritten by merge:
	src/lib.rs
"""
