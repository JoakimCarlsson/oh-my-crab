[package]
name = "omc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP tool servers as tools of crab: their tools and resources, set up by the client or in files, signed in to with OAuth"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
futures-util = "0.3.34"
oauth2 = "5.0.0"
omc-tools = { version = "0.1.3", path = "../omc-tools" }
omc-wire = { version = "0.1.3", path = "../omc-wire" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "io-util", "process", "time", "net"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
