[package]
name = "omc-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omc-providers.workspace = true
omc-tools.workspace = true
omc-context = { version = "0.1.0", path = "../omc-context" }
async-trait = "0.1.92"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
omc-wire = { version = "0.1.0", path = "../omc-wire" }
tokio = { version = "1.54.1", features = ["test-util"] }
