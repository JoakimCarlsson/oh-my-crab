[package]
name = "omc-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The agent loop of crab: model requests, tool calls, approvals, hooks, compaction and subagents"
repository.workspace = true
homepage.workspace = true

[dependencies]
omc-providers.workspace = true
omc-tools.workspace = true
omc-context = { version = "0.1.1", path = "../omc-context" }
async-trait = "0.1.92"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "process"] }

[dev-dependencies]
omc-wire = { version = "0.1.1", path = "../omc-wire" }
omc-script = { version = "0.1.1", path = "../omc-script" }
tokio = { version = "1.54.1", features = ["test-util"] }
