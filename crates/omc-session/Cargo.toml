[package]
name = "omc-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One crab conversation, driven by commands and reported as events"
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
dirs = "7.0.0"
omc-agent = { version = "0.1.2", path = "../omc-agent" }
omc-context = { version = "0.1.2", path = "../omc-context" }
omc-dap = { version = "0.1.2", path = "../omc-dap" }
omc-extensions = { version = "0.1.2", path = "../omc-extensions" }
omc-hooks = { version = "0.1.2", path = "../omc-hooks" }
omc-auth = { version = "0.1.2", path = "../omc-auth" }
omc-lsp = { version = "0.1.2", path = "../omc-lsp", optional = true }
omc-mcp = { version = "0.1.2", path = "../omc-mcp" }
omc-memory = { version = "0.1.2", path = "../omc-memory" }
omc-providers = { version = "0.1.2", path = "../omc-providers" }
omc-script = { version = "0.1.2", path = "../omc-script" }
omc-tools = { version = "0.1.2", path = "../omc-tools" }
omc-wire = { version = "0.1.2", path = "../omc-wire" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "io-util", "io-std", "time"] }
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = ["lsp"]
lsp = ["dep:omc-lsp"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
