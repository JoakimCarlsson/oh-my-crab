[package]
name = "omc-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The script tool of crab: JavaScript in an embedded QuickJS sandbox that calls the other tools"
repository.workspace = true
homepage.workspace = true

[dependencies]
omc-context = { version = "0.1.2", path = "../omc-context" }
omc-tools.workspace = true
async-trait = "0.1.92"
futures-util = "0.3.34"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
