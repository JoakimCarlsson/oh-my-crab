[package]
name = "omc-index"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A local semantic and keyword index of a project's code for crab"
repository.workspace = true
homepage.workspace = true

[dependencies]
ast-grep-core = "0.51.1"
ast-grep-language = { version = "0.51.1", default-features = false, features = [
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-lua",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
dirs = "7.0.0"
globset = "0.4.21"
ignore = "0.4.34"
model2vec-rs = { version = "0.4.0", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
sqlite-vec = "0.1.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
