[package]
name = "omc-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sign-in for crab: OAuth, device-code and API-key credentials, stored and refreshed"
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
oauth2 = "5.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
url = "2.5.8"
